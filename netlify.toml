[build]
  # baixa os arquivos reais do LFS antes do build
  command = "git lfs install && git lfs fetch --all && git lfs checkout && npm ci && npm run build"
  publish = "dist"

# SPA: redireciona qualquer rota pra index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# (opcional) headers básicos
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
